# Render Blueprint for the hosted ModelLore demo: the API on a free web service.
#
# The free plan has no persistent disk, so the demo keeps its SQLite database
# and its files (uploads, artifacts, lineage, MLflow runs) on the instance
# itself. Everything resets together whenever Render restarts, redeploys, or
# wakes the service after 15 idle minutes, so the demo is always consistent.
#
# MLFLOWHUB_API_KEY is entered in the Render dashboard when the Blueprint is
# created. It is never stored in this file.
services:
  - type: web
    name: modellore-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy a new commit on main only after CI has passed on it.
    autoDeployTrigger: checksPass
    envVars:
      - key: MLFLOWHUB_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/db/modellore.db
      - key: MLFLOW_TRACKING_URI
        value: sqlite:////app/mlruns/mlflow.db
      # Public demo limits: small files, short requests, and a slow trickle of
      # training. Rate limits are shared by every visitor behind the proxies.
      - key: MODELLORE_MAX_UPLOAD_MB
        value: "1"
      - key: MODELLORE_MAX_UPLOAD_ROWS
        value: "5000"
      - key: MODELLORE_MAX_UPLOAD_COLUMNS
        value: "50"
      - key: MODELLORE_MAX_PREDICT_ROWS
        value: "100"
      - key: MODELLORE_RATE_LIMIT_UPLOAD
        value: "10"
      - key: MODELLORE_RATE_LIMIT_TRAIN
        value: "6"
      - key: MODELLORE_RATE_LIMIT_PREDICT
        value: "60"
